<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inti - Veltrastoreid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1a0004; color: white; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { color: #ff2a75; text-align: center; }
        .card { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255, 42, 117, 0.3); margin-bottom: 20px; }
        
        button { color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: #ff2a75; }
        .btn-primary:hover { background: #d61f5f; }
        .btn-success { background: #2ed573; color: #000; }
        .btn-success:hover { background: #26b360; }
        .btn-danger { background: #ff4757; }
        .btn-danger:hover { background: #ff2a3b; }
        .btn-outline { background: transparent; border: 1px dashed #ff2a75; color: #ff2a75; }
        .btn-small { width: auto; padding: 10px 15px; font-size: 0.9rem; margin: 0; border-radius: 8px;}
        .btn-logout { background: #555; margin-bottom: 20px; }

        select, input { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ff2a75; background: #000; color: white; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif;}
        .varian-box { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #ff2a75; }
        .varian-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        label { font-size: 0.85rem; color: #b3b3b3; font-weight: 600; }
        .logo-preview { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; display: block; margin: 0 auto 15px auto; border: 2px solid #ff2a75; background: #222; }
        hr { border: 0; border-top: 1px solid rgba(255,42,117,0.3); margin: 20px 0; }

        /* Layar Login */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        #adminScreen { display: none; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- LAYAR LOGIN -->
        <div id="loginScreen">
            <div class="card" style="width: 100%; text-align: center;">
                <h2>🔒 Akses Terbatas</h2>
                <p style="color: #b3b3b3; font-size: 0.9rem; margin-bottom: 20px;">Silakan login untuk masuk ke Dapur Veltrastore</p>
                <input type="email" id="emailInput" placeholder="Masukkan Email Admin">
                <input type="password" id="passwordInput" placeholder="Masukkan Password">
                <button id="btnLogin" class="btn-primary">Masuk ke Sistem</button>
            </div>
        </div>

        <!-- LAYAR ADMIN -->
        <div id="adminScreen">
            <h2>⚙️ Admin Veltrastore</h2>
            <button id="btnLogout" class="btn-logout">🚪 Keluar (Logout)</button>

            <!-- KOTAK 1: TAMBAH APLIKASI -->
            <div class="card" id="addCard">
                <h3 style="color: #2ed573;">➕ Tambah Aplikasi Baru</h3>
                <label>Nama Aplikasi:</label>
                <input type="text" id="newAppName" placeholder="Contoh: Canva Pro">
                <button id="btnAddApp" class="btn-success">Buat Aplikasi Baru</button>
            </div>

            <!-- KOTAK 2: EDIT & HAPUS APLIKASI -->
            <div class="card" id="editCard">
                <h3>Pilih Aplikasi Untuk Diedit</h3>
                <select id="selectProduk"></select>

                <div id="editorArea" style="display:none;">
                    
                    <!-- FITUR BARU: GANTI NAMA APLIKASI -->
                    <div style="background: rgba(46, 213, 115, 0.1); padding: 15px; border-radius: 10px; border: 1px solid #2ed573; margin-bottom: 20px;">
                        <label>✏️ Ubah Nama Aplikasi:</label>
                        <div class="flex-row" style="margin-top: 5px;">
                            <input type="text" id="inputEditNama" placeholder="Nama baru..." style="margin-bottom: 0;">
                            <button id="btnEditNama" class="btn-success btn-small" style="margin-top: 0;">Simpan Nama</button>
                        </div>
                        <p style="font-size: 0.75rem; color: #b3b3b3; margin-top: 5px; margin-bottom: 0;">*Hati-hati, mengganti nama akan langsung disimpan ke database.</p>
                    </div>

                    <div style="background: rgba(255,42,117,0.1); padding: 15px; border-radius: 10px; border: 1px solid #ff2a75; margin-bottom: 20px;">
                        <label>🖼️ Link Logo Aplikasi (URL dari Google):</label>
                        <img id="previewLogo" class="logo-preview" src="https://via.placeholder.com/60" alt="Preview Logo">
                        <input type="text" id="inputLogo" placeholder="Paste link gambar (https://...) di sini">
                    </div>

                    <div id="varianContainer"></div>
                    
                    <button id="btnAddVariant" class="btn-outline">+ Tambah Varian Baru</button>
                    <hr>
                    
                    <button id="btnSimpan" class="btn-primary">💾 SIMPAN PERUBAHAN KE DATABASE</button>
                    <p style="font-size: 0.8rem; text-align:center; margin-top:10px; color:#25d366;">*Jangan lupa klik simpan setelah mengedit varian/logo!</p>
                    
                    <hr>
                    <button id="btnHapusApp" class="btn-danger">🗑️ HAPUS APLIKASI INI DARI TOKO</button>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT DATABASE FIREBASE & AUTHENTICATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ9JmZRYU3i9_mrYsZPj7nr566wR7VQ78",
            authDomain: "veltra-store-694e1.firebaseapp.com",
            projectId: "veltra-store-694e1",
            storageBucket: "veltra-store-694e1.firebasestorage.app",
            messagingSenderId: "601493638172",
            appId: "1:601493638172:web:12d9153c605d9b6e9863d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "toko", "katalog");

        let currentData = {};
        let currentLogo = {};

        // --- SISTEM LOGIN & LOGOUT ---
        const loginScreen = document.getElementById('loginScreen');
        const adminScreen = document.getElementById('adminScreen');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                adminScreen.style.display = 'block';
                loadData(); 
            } else {
                loginScreen.style.display = 'flex';
                adminScreen.style.display = 'none';
            }
        });

        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if(!email || !password) return alert("Email dan Password wajib diisi!");
            
            document.getElementById('btnLogin').innerText = "Memeriksa...";
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { document.getElementById('btnLogin').innerText = "Masuk ke Sistem"; })
                .catch(() => {
                    alert("Akses Ditolak! Email atau Password salah.");
                    document.getElementById('btnLogin').innerText = "Masuk ke Sistem";
                });
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth).then(() => { alert("Kamu telah keluar dengan aman."); });
        });

        // --- SISTEM DATABASE CMS ---
        async function loadData() {
            try {
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    currentData = snap.data().dataProduk || {};
                    currentLogo = snap.data().dataLogo || {};
                    renderSelect();
                }
            } catch (e) {
                alert("Gagal memuat data. Pastikan kamu memiliki akses internet.");
            }
        }

        function renderSelect() {
            const select = document.getElementById('selectProduk');
            const currentValue = select.value;
            select.innerHTML = '<option value="">-- Silakan Pilih Aplikasi --</option>';
            
            Object.keys(currentData).sort().forEach(key => {
                select.innerHTML += `<option value="${key}">${key}</option>`;
            });
            
            if(currentData[currentValue]) { select.value = currentValue; }
        }

        function syncInputs(key) {
            if(!key || !currentData[key]) return;
            currentLogo[key] = document.getElementById('inputLogo').value;
            currentData[key].forEach((varian, index) => {
                const inputNama = document.getElementById(`nama_${key}_${index}`);
                const inputHarga = document.getElementById(`harga_${key}_${index}`);
                if(inputNama && inputHarga) {
                    varian.nama = inputNama.value;
                    varian.harga = inputHarga.value;
                }
            });
        }

        function renderVariants(key) {
            const container = document.getElementById('varianContainer');
            container.innerHTML = '';
            
            currentData[key].forEach((varian, index) => {
                container.innerHTML += `
                    <div class="varian-box">
                        <div class="varian-header">
                            <label>Varian ke-${index + 1}:</label>
                            <button class="btn-danger btn-small btn-hapus-varian" data-index="${index}" style="padding: 5px 10px; font-size: 0.8rem;">Hapus</button>
                        </div>
                        <input type="text" id="nama_${key}_${index}" value="${varian.nama}" placeholder="Nama Paket">
                        <label>Harga (Misal: Rp 20.000):</label>
                        <input type="text" id="harga_${key}_${index}" value="${varian.harga}" placeholder="Rp 0">
                    </div>
                `;
            });
        }

        // EVENT: Pilih Dropdown Aplikasi
        document.getElementById('selectProduk').addEventListener('change', (e) => {
            const key = e.target.value;
            const editorArea = document.getElementById('editorArea');
            const inputLogo = document.getElementById('inputLogo');
            const previewLogo = document.getElementById('previewLogo');
            const inputEditNama = document.getElementById('inputEditNama');
            
            if(!key) { editorArea.style.display = 'none'; return; }

            editorArea.style.display = 'block';
            
            // Set input nama baru dengan nama yang sekarang
            inputEditNama.value = key;

            const logoUrl = currentLogo[key] || '';
            inputLogo.value = logoUrl;
            previewLogo.src = logoUrl ? logoUrl : 'https://via.placeholder.com/60';
            
            inputLogo.oninput = () => { previewLogo.src = inputLogo.value ? inputLogo.value : 'https://via.placeholder.com/60'; };
            renderVariants(key);
        });

        // EVENT: Fitur Baru - Ubah Nama Aplikasi
        document.getElementById('btnEditNama').addEventListener('click', async () => {
            const oldName = document.getElementById('selectProduk').value;
            const newName = document.getElementById('inputEditNama').value.trim();

            if(!oldName) return alert("Pilih aplikasi dulu!");
            if(!newName) return alert("Nama baru tidak boleh kosong!");
            if(oldName === newName) return alert("Nama belum ada perubahan!");
            if(currentData[newName]) return alert("Aplikasi dengan nama ini sudah ada, pilih nama lain!");

            if(confirm(`Yakin ingin mengubah nama dari "${oldName}" menjadi "${newName}"?`)) {
                document.getElementById('btnEditNama').innerText = "⏳";
                
                // Sinkronkan input varian dan logo yang mungkin baru diketik sebelum ganti nama
                syncInputs(oldName);

                // Pindahkan data ke nama baru
                currentData[newName] = currentData[oldName];
                currentLogo[newName] = currentLogo[oldName];

                // Hapus data lama
                delete currentData[oldName];
                delete currentLogo[oldName];

                try {
                    await setDoc(docRef, { dataProduk: currentData, dataLogo: currentLogo });
                    alert(`✅ Nama aplikasi berhasil diubah menjadi ${newName}!`);
                    
                    renderSelect(); // Update dropdown
                    document.getElementById('selectProduk').value = newName; // Pilih nama baru otomatis
                    document.getElementById('selectProduk').dispatchEvent(new Event('change')); // Refresh kotak varian
                    document.getElementById('btnEditNama').innerText = "Simpan Nama";
                } catch(e) {
                    alert("Gagal mengubah nama: " + e.message);
                    document.getElementById('btnEditNama').innerText = "Simpan Nama";
                }
            }
        });

        document.getElementById('btnAddApp').addEventListener('click', async () => {
            const newName = document.getElementById('newAppName').value.trim();
            if(!newName) return alert("Ketik nama aplikasi dulu!");
            if(currentData[newName]) return alert("Aplikasi ini sudah ada di daftar!");

            currentData[newName] = [{nama: "Paket 1 Bulan", harga: "Rp 0"}];
            currentLogo[newName] = "";

            await setDoc(docRef, { dataProduk: currentData, dataLogo: currentLogo });
            alert(`Aplikasi ${newName} berhasil ditambahkan! Silakan edit harganya.`);
            
            document.getElementById('newAppName').value = '';
            renderSelect();
            document.getElementById('selectProduk').value = newName;
            document.getElementById('selectProduk').dispatchEvent(new Event('change'));
        });

        document.getElementById('btnHapusApp').addEventListener('click', async () => {
            const key = document.getElementById('selectProduk').value;
            if(!key) return;
            
            if(confirm(`⚠️ PERINGATAN!\nYakin ingin MENGHAPUS ${key} beserta seluruh harganya?`)) {
                delete currentData[key];
                delete currentLogo[key];

                await setDoc(docRef, { dataProduk: currentData, dataLogo: currentLogo });
                alert(`✅ Aplikasi ${key} berhasil dihapus dari toko.`);
                
                document.getElementById('editorArea').style.display = 'none';
                renderSelect();
            }
        });

        document.getElementById('btnAddVariant').addEventListener('click', () => {
            const key = document.getElementById('selectProduk').value;
            syncInputs(key); 
            currentData[key].push({nama: "Paket Baru", harga: "Rp 0"});
            renderVariants(key);
        });

        document.getElementById('varianContainer').addEventListener('click', (e) => {
            if(e.target.classList.contains('btn-hapus-varian')) {
                const index = e.target.getAttribute('data-index');
                const key = document.getElementById('selectProduk').value;
                syncInputs(key);
                currentData[key].splice(index, 1);
                renderVariants(key);
            }
        });

        document.getElementById('btnSimpan').addEventListener('click', async () => {
            const key = document.getElementById('selectProduk').value;
            if(!key) return alert("Pilih aplikasi dulu!");

            syncInputs(key);

            try {
                document.getElementById('btnSimpan').innerText = "⏳ Sedang Menyimpan...";
                await setDoc(docRef, { dataProduk: currentData, dataLogo: currentLogo });
                alert("✅ Semua Data Berhasil Disimpan ke Database!");
                document.getElementById('btnSimpan').innerText = "💾 SIMPAN PERUBAHAN KE DATABASE";
            } catch(e) {
                alert("Gagal simpan! Pastikan koneksimu lancar.");
                document.getElementById('btnSimpan').innerText = "💾 SIMPAN PERUBAHAN KE DATABASE";
            }
        });

    </script>
</body>
</html>
